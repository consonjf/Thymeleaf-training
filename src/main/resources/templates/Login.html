<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/icon/thymeleaf.png">
</head>

<body>
<form class="card" role="main" aria-label="Login form" th:action="@{/login}" method="post">

    <div class="logo-img-container">
    <img class="logo-img" src="/icon/thymeleaf.png" alt="Logo">
    </div>

    <h1 class="welcome">Welcome to Thymeleaf</h1>
    <p class="subtitle">Sign in to continue</p>

    <div id="loginError" class="error" th:if="${error}" th:text="${error}"></div>

    <label class="label label-with-icon" for="username">
        <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
                    d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
                    stroke="currentColor"
                    stroke-width="1.8"
            />
            <path
                    d="M4 20c0-4 4-6 8-6s8 2 8 6"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
            />
        </svg>
        <span>Username</span>
    </label>

    <div class="username-section">
    <input
            class="input"
            id="username"
            name="username"
            type="text"
            placeholder="Enter username"
            autocomplete="username"
            required
    />
    </div>

    <label class="label label-with-icon" for="password">
        <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
                    d="M7 10V8a5 5 0 0 1 10 0v2"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
            />
            <rect
                    x="5"
                    y="10"
                    width="14"
                    height="10"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.8"
            />
            <path
                    d="M12 14v3"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
            />
        </svg>
        <span>Password</span>
    </label>

    <div class="username-section">
    <input
            class="input"
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
    />
    </div>

<!--    <button class="btn" type="submit">Sign In</button>-->
    <button class="cssbuttons-io-button" type="submit">
        Sign In
        <div class="icon">
            <svg
                    height="24"
                    width="24"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
            >
                <path d="M0 0h24v24H0z" fill="none"></path>
                <path
                        d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                        fill="currentColor"
                ></path>
            </svg>
        </div>
    </button>

</form>
</form>

<script>
    window.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('loginError');
      if (!el) return;

      setTimeout(() => {
        el.style.display = 'none';
      }, 5000);
    });
</script>

</body>
</html>
