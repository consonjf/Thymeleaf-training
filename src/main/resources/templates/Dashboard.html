    <link rel="stylesheet" href="/css/dashboard.css">

</head>

    <main class="container">
        <section class="panel admin" th:if="${role == 'ADMIN'}">
           <aside class="sidebar">
               <div class="brand-logo">
                   <img class="brand" src="/icon/thymeleaf.png" alt="Logo">
                   <p class="brand-name">ThymeLeaf Training</p>
               </div>
               <nav class="nav">
                   <div class="nav-item">
                   <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    </svg>
                    </span>
                   <span class="nav-label">Home</span>
                   <span class="nav-pill">New</span>
                   </div>
                   <div class="nav-item">
                   <span class="nav-icon" aria-hidden="true">
                     <svg viewBox="0 0 24 24" fill="none">
                      <path d="M7 3v3M17 3v3M4.5 8.5h15"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                      <path d="M5 6.5h14a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2Z"
                            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    </svg>
                    </span>
                       <span class="nav-label">Calendar</span>

                   </div>
                   <div class="nav-item">
                   <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                    <path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"
                    stroke="currentColor" stroke-width="1.8"/>
                        <path d="M8 9h8M8 13h8M8 17h5"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    </span>
                       <span class="nav-label">Projects</span>

                   </div>
                   <div class="nav-item">
                   <span class="nav-icon" aria-hidden="true">
                   <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                  d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  />
                  <path
                  d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.12 7.12 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.12.52-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.41 1.05.72 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54c.58-.22 1.12-.52 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58Z"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linejoin="round"
                  />
                </svg>
                    </span>
                       <span class="nav-label">Settings</span>
                   </div>
               </nav>
               <div class="sidebar-footer">
                   <div class="profile">
                       <div class="profile-avatar">A</div>
                       <div class="profile-meta">
                           <div class="profile-name" th:text="${username}">username</div>
                           <div class="profile-role" th:text="${role}">ROLE</div>
                       </div>
                   </div>
                   <form th:action="@{/logout}" method="get">
                       <button class="logout" type="submit">
                           Logout
                       </button>
                   </form>
               </div>
           </aside>
            <main class="content">
                <div class="welcome-container">
                    <h1>Welcome, </h1>
                    <h1 th:text="${username}">username</h1>
                </div>
                <p>Contents and Features coming soon. Stay tuned!</p>
            </main>
        </section>

        <section class="panel user" th:unless="${role == 'ADMIN'}">
            <aside class="sidebar">
                <div class="brand-logo">
                    <img class="brand" src="/icon/thymeleaf.png" alt="Logo">
                    <p class="brand-name">ThymeLeaf</p>
                </div>
                <nav class="nav">
                    <div class="nav-item">
                   <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    </svg>
                    </span>
                        <span class="nav-label">Home</span>
                        <span class="nav-pill">New</span>
                    </div>
                    <div class="nav-item">
                   <span class="nav-icon" aria-hidden="true">
                   <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                          d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
                          stroke="currentColor"
                          stroke-width="1.8"
                  />
                  <path
                          d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.12 7.12 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.12.52-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.41 1.05.72 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54c.58-.22 1.12-.52 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58Z"
                          stroke="currentColor"
                          stroke-width="1.3"
                          stroke-linejoin="round"
                  />
                </svg>
                    </span>
                        <span class="nav-label">Settings</span>
                    </div>
                </nav>
                <div class="sidebar-footer">
                    <div class="profile">
                        <div class="profile-avatar"
                             th:text="${#strings.toUpperCase(username.substring(0,1))}">A</div>

                        <div class="profile-meta">
                            <div class="profile-name" th:text="${username}">username</div>
                            <div class="profile-role" th:text="${role}">ROLE</div>
                        </div>
                    </div>
                    <form th:action="@{/logout}" method="get">
                        <button class="logout" type="submit">
                            Logout
                        </button>
                    </form>
                </div>
            </aside>
            <main class="content">
                <div class="welcome-container">
                    <h1>Welcome, </h1>
                    <h1 th:text="${username}">username</h1>
                </div>
                <p>Contents and Features coming soon. Stay tuned!</p>
            </main>
        </section>
    </main>

    </body>
</html>
